name: Semantic PR

# Validates that the PR title follows Conventional Commits. With squash merges
# the PR title becomes the commit subject on main, so this is the gate that
# keeps history consistent with the commit convention (CI lints commits at the
# PR-title level, not per-commit).
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] title-only check, no checkout (see below)
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      title:
        description: Generated pull request title
        required: true
        type: string
      head_sha:
        description: Generated pull request head commit
        required: true
        type: string

# Permissions are assigned per job. The normal PR check only reads the title;
# the generated-release path publishes an explicit check run because GitHub
# does not associate workflow_dispatch job checks with pull requests.
permissions: {}

concurrency:
  group: semantic-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Match the commit-type vocabulary used across the repo. `revert` is
          # deliberately absent: the Conventional Commits spec does not define
          # revert behaviour ("we leave it to tooling authors"), and changelogen
          # has no `revert` type, so such a commit would be dropped from the
          # changelog in silence. Type a revert by its effect instead —
          # `fix(relay): revert the msgpack bin wire format` lands in Fixes,
          # which is where a reader looks for what changed for them, and carries
          # the right semver. GitHub's own Revert button produces `Revert "…"`,
          # which fails this gate on all three counts anyway, so the title has to
          # be rewritten by hand either way.
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
            ci
            build
            perf
            style
          # A closed vocabulary, and every title has to pick from it. The axis is
          # the capability a reader of the changelog experiences, NOT the package
          # the diff lands in: Figwright ships one product, so `mcp` / `shared`
          # would say nothing (they would be four fifths of every release), while
          # `codegen` / `design` / `relay` say which part of it moved. See
          # CONTRIBUTING.md for what each one covers and where the boundaries run.
          scopes: |
            codegen
            design
            grounding
            tools
            relay
            plugin
            skills
            deps
            repo
          requireScope: true
          # An unscoped title is not an unclassifiable change — it is one nobody
          # had a list to pick from. Requiring the scope is what keeps the
          # generated changelog uniform, since changelogen renders the scope as
          # the bold lead-in of every line and an entry without one reads as an
          # outlier next to the rest of its section.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character (changelogen capitalizes
            it when rendering the changelog).

  validate-generated:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Validate title and report the required check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_TITLE: ${{ inputs.title }}
        shell: bash
        run: |
          conclusion=success
          summary="Generated release title follows the repository convention."
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Generated release head is invalid: $HEAD_SHA" >&2
            exit 1
          elif [[ ! "$PR_TITLE" =~ ^chore\(repo\):\ prepare\ Kiwi\ Reader\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            conclusion=failure
            summary="Generated release title is invalid: $PR_TITLE"
          else
            actual_title=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.state == "open")][0].title // ""')
            if [[ "$actual_title" != "$PR_TITLE" ]]; then
              conclusion=failure
              summary="No open pull request at $HEAD_SHA has the expected title."
            fi
          fi

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=validate \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=Semantic PR" \
            -f "output[summary]=$summary" >/dev/null

          if [[ "$conclusion" = failure ]]; then
            echo "$summary" >&2
            exit 1
          fi
