name: Kiwi Reader Release

on:
  push:
    tags: ['kiwi-v*']
    branches: [main]
    paths:
      - packages/kiwi-reader/extension/manifest.json
      - packages/kiwi-reader/release/codex-plugin/.codex-plugin/plugin.json

permissions: {}

concurrency:
  group: kiwi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm test

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          extension_version=$(node -p "require('./packages/kiwi-reader/extension/manifest.json').version")
          plugin_version=$(node -p "require('./packages/kiwi-reader/release/codex-plugin/.codex-plugin/plugin.json').version")
          test "$extension_version" = "$plugin_version" || {
            echo "Extension $extension_version does not match plugin $plugin_version" >&2
            exit 1
          }
          tag="kiwi-v$extension_version"
          if [[ "$GITHUB_REF_TYPE" = "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Kiwi Reader $extension_version" >&2
            exit 1
          fi
          {
            echo "version=$extension_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm package:kiwi

      - name: Package release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          cd artifacts
          zip -r "figwright-kiwi-reader-v${VERSION}.zip" figwright-kiwi-reader
          sha256sum "figwright-kiwi-reader-v${VERSION}.zip" > "figwright-kiwi-reader-v${VERSION}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "artifacts/figwright-kiwi-reader-v${VERSION}.zip" \
            "artifacts/figwright-kiwi-reader-v${VERSION}.sha256" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Figwright Kiwi Reader $VERSION"
