name: Kiwi Reader Release

on:
  push:
    tags: ['kiwi-v*']

permissions: {}

concurrency:
  group: kiwi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm test

      - name: Verify tag version
        shell: bash
        run: |
          manifest_version=$(node -p "require('./packages/kiwi-reader/extension/manifest.json').version")
          tag_version="${GITHUB_REF_NAME#kiwi-v}"
          test "$manifest_version" = "$tag_version" || {
            echo "Tag $tag_version does not match extension $manifest_version" >&2
            exit 1
          }

      - run: pnpm package:kiwi

      - name: Package release
        shell: bash
        run: |
          asset_version="${GITHUB_REF_NAME#kiwi-}"
          cd artifacts
          zip -r "figwright-kiwi-reader-${asset_version}.zip" figwright-kiwi-reader
          sha256sum "figwright-kiwi-reader-${asset_version}.zip" > "figwright-kiwi-reader-${asset_version}.sha256"

      - name: Publish GitHub Release
        shell: bash
        run: |
          asset_version="${GITHUB_REF_NAME#kiwi-}"
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/figwright-kiwi-reader-${asset_version}.zip" \
            "artifacts/figwright-kiwi-reader-${asset_version}.sha256" \
            --generate-notes \
            --title "Figwright Kiwi Reader ${GITHUB_REF_NAME#kiwi-v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
