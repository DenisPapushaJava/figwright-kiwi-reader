<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FigLens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="side-panel">
    <main class="panel">
      <header class="header">
        <img src="icons/icon-32.png" width="36" height="36" alt="" />
        <div class="header-copy">
          <div class="header-title">
            <h1>FigLens</h1>
            <span id="extension-version" class="extension-version" title="Версия расширения"></span>
          </div>
          <p>Figma → AI, только чтение</p>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-heading">
          <span id="status-dot" class="status-dot"></span>
          <div>
            <strong id="status-title">Проверяю состояние…</strong>
            <p id="status-detail">Связываюсь с расширением</p>
          </div>
        </div>
      </section>

      <section id="error-card" class="error-card" hidden>
        <button id="copy-diagnostics" type="button">Копировать диагностику</button>
      </section>

      <section id="file-card" class="file-card">
        <div class="file-label">Текущий макет</div>
        <strong id="file-title">Не выбран</strong>
        <div class="node-row">
          <span id="node-label">Выбранный узел</span>
          <strong id="node-name">Выберите узел в Figma</strong>
        </div>
      </section>

      <section id="capture-summary" class="capture-summary" aria-label="Прочитанные узлы" hidden>
        <span id="node-count">0</span>
        <div>
          <strong>узлов прочитано</strong>
        </div>
      </section>

      <section id="capture-options" class="capture-options" aria-labelledby="capture-options-title">
        <strong id="capture-options-title">Изображения</strong>
        <label>
          <input id="capture-images" type="checkbox" />
          <span>
            <b>Сохранять исходные изображения</b>
            <small id="capture-images-help">Для фото и текстур из макета</small>
          </span>
        </label>
      </section>

      <div class="actions">
        <button id="primary-action" class="primary" type="button">Подключить макет</button>
        <button id="disconnect-action" class="secondary" type="button" hidden>Отключить</button>
      </div>
      <p id="recapture-note" class="recapture-note" hidden>
        Обновление перезагрузит вкладку Figma.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
